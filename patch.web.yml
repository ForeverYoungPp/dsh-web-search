# dsh-web-search local development overlay: loads the local source via --patch,
# so no build is required.
#
# Usage, run inside your deepseek-harness source workspace
# (`web` is an alias for `--profile web`):
#   pnpm dsh web --patch /path/to/dsh-web-search/patch.web.yml
#
# The relative path of the row name is anchored to this file's directory (the
# loader's anchorInsertedPluginNames converts ./ and ../ to file:// URLs).
# The browser half is handled by client-modules, which walks up from
# src/index.js to find package.json's dsh.client manifest and injects the
# bundle named by exports["./client"] into the startup graph
# (src/client/bundle.js is a hand-written factory format, no bundler needed).
#
# Note: overriding an existing row (- id: web) is a top-level entry, not a
# child of - insert:. insert is only for new rows; an override modifies the
# row's config (name and inject keep the original row values).

- insert:
    - id: dsh-web-search
      name: './src/index.js'

- id: web
  config:
    searchProvider: dsh-web-search
    fetchProvider: http
